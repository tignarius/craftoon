name: Publish Craftoon Support

# Run manually after choosing GitHub Actions in Settings > Pages.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: craftoon-support-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload support website only
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/support
      - name: Deploy support website
        id: deployment
        uses: actions/deploy-pages@v4
